name = "InhomogeneousDeformations"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["InhomogeneousDeformations"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# toolchain port (v4.34): the header linter did not exist at v4.29.1; the repository is MIT-licensed,
# not the Apache header form that mathlib's header linter expects.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "InhomogeneousDeformations"
